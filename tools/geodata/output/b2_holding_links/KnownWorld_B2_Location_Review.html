<script>
'use strict';const DB=JSON.parse(document.getElementById('data').textContent),H=DB.holdings,M=DB.markers, hm=Object.fromEntries(H.map(h=>[h.holding_id,h])),mm=Object.fromEntries(M.map(m=>[m.marker_id,m]));
const N=DB.counts;const orphanCount=M.filter(m=>m.link_status==='NOT_LINKED_TO_HOLDING').length;
const opts=[['overview','Overview',''],['all','All holdings',H.length],['matched','Matched holdings',H.filter(h=>h.status==='CANDIDATE_NOT_APPROVED').length],['unmatched','Unmatched holdings',H.filter(h=>h.status==='NO_MATCHED_MARKER').length],['domains','Domains / regions',H.filter(h=>h.status==='DOMAIN_NOT_SETTLEMENT').length],['markers','All map markers',M.length],['unlinked','Unlinked markers',M.filter(m=>m.link_status==='NOT_LINKED_TO_HOLDING').length],['shared','Shared locations',''],['map','Coordinate map',''],['sources','Sources & guide','']];
let view='overview',query='',sortKey='',sortDir=1,filterType='',filterZone='',page=0;const PAGE=60;
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function label(s){return({CANDIDATE_NOT_APPROVED:'Candidate link',NO_MATCHED_MARKER:'No marker match',DOMAIN_NOT_SETTLEMENT:'Political domain',CANDIDATE_ID_MATCH:'ID match',CANDIDATE_EXACT_NAME:'Name match',NOT_LINKED_TO_HOLDING:'No holding link'}[s]||s||'—')}
function badge(s){let c=s==='CANDIDATE_NOT_APPROVED'||s==='CANDIDATE_ID_MATCH'||s==='CANDIDATE_EXACT_NAME'?'':s==='DOMAIN_NOT_SETTLEMENT'?'mute':'warn';return `<span class="badge ${c}">${safe(label(s))}</span>`}
function reviewKey(kind,id){return 'kw_b2_2_review_v1_'+kind+'_'+id}function getReview(kind,id){try{return JSON.parse(localStorage.getItem(reviewKey(kind,id))||'{}')}catch(e){return {}}}function setReview(kind,id,field,value){const k=reviewKey(kind,id),s=getReview(kind,id);s[field]=value;localStorage.setItem(k,JSON.stringify(s))}
function goto(k){view=k;query='';sortKey='';filterType='';filterZone='';page=0;render()}
function render(){document.getElementById('nav').innerHTML=opts.map(([id,t,count])=>`<button class="${view===id?'active':''}" onclick="goto('${id}')">${t}<span class="num">${count}</span></button>`).join('');let titles={overview:'Geographic reconciliation',all:'All '+H.length+' political holdings',matched:N.matched+' candidate holding links',unmatched:N.unmatched+' holdings needing matching',domains:N.domains+' non-site political domains',markers:M.length+' master-map observations',unlinked:orphanCount+' unlinked map markers',shared:'Shared map sites',map:'Map observations',sources:'Data sources & definitions'};document.getElementById('heading').textContent=titles[view];document.getElementById('intro').textContent=view==='overview'?'One place to see what we know, what still needs matching and what is safe to build.':view==='map'?'Coordinates-only plot. This is not a land/slope map and cannot authorize construction.':'Click any row for its details, provenance, and your private review notes.';const target=document.getElementById('content');if(view==='overview')target.innerHTML=home();else if(view==='sources')target.innerHTML=sourceView();else if(view==='map'){target.innerHTML=mapView();drawMap()}else renderTable()}
function home(){const shared=Object.entries(Object.groupBy?Object.groupBy(H.flatMap(h=>(h.marker_ids||'').split(';').filter(Boolean).map(id=>({id,h:h.holding_id}))),x=>x.id):{});return `<div class="notice"><b>Important:</b> A candidate match is <b>not yet verified correct</b>, and no map observation is approved for building generation. The 101 unmatched holdings do not necessarily lack coordinates: many can be sub-sites or name variants.</div><div class="cards"><div class="card" onclick="goto('all')"><div class="metric blue">${H.length}</div><div class="kpi-label">Political holdings audited</div></div><div class="card" onclick="goto('matched')"><div class="metric green">${N.matched}</div><div class="kpi-label">Have candidate map markers</div></div><div class="card" onclick="goto('unmatched')"><div class="metric orange">${N.unmatched}</div><div class="kpi-label">Need a holding-to-marker link</div></div><div class="card" onclick="goto('domains')"><div class="metric gray">${N.domains}</div><div class="kpi-label">Territories / political regions</div></div></div><div class="split"><div class="panel"><h2>Holding coverage</h2><p>Current matching outcome from your pushed B2.2 output files.</p><div class="bar"><span style="width:${N.matched/H.length*100}%;background:#65c9a7"></span><span style="width:${N.unmatched/H.length*100}%;background:#ecbb6c"></span><span style="width:${N.domains/H.length*100}%;background:#82909d"></span></div><div class="legend"><span><i class="dot" style="background:#65c9a7"></i>${N.matched} linked candidates</span><span><i class="dot" style="background:#ecbb6c"></i>${N.unmatched} unmatched</span><span><i class="dot" style="background:#82909d"></i>${N.domains} domains</span></div><h3>What to review first</h3><p><b>Unmatched holdings:</b> Check if they're sub-sites of a mapped town, unmarked minor castles, or naming differences.<br><b>Linked holdings:</b> Check whether the identity and coordinate truly correspond. None are building-approved.<br><b>Shared sites:</b> Multiple political holdings can belong to one mapped place.</p><button class="action" onclick="goto('unmatched')">Review unmatched holdings →</button></div><div class="panel"><h2>Map evidence</h2><div class="metric blue">${M.length}</div><p>Active map observations with candidate X/Z</p><div class="metric orange">${orphanCount}</div><p>Markers not linked to a political holding. Many are independent places or historical sites, not errors.</p><div class="metric green">0</div><p>Approved building sites in the B2.2 source records.</p><button class="outline" onclick="goto('map')">Explore geographic plot →</button></div></div>`}
function sourceView(){return `<div class="notice">This viewer is generated from your original B2.2 files. It does <b>not</b> change those files or your Minecraft world. Your review notes are stored in this browser until you export them.</div><div class="split"><div class="panel"><h2>What each status means</h2><p>${badge('CANDIDATE_NOT_APPROVED')} A holding has at least one named coordinate observation; its location identity and building footprint still need verification.</p><p>${badge('NO_MATCHED_MARKER')} A holding could not be associated with a current observation using the conservative existing name/ID matching.</p><p>${badge('DOMAIN_NOT_SETTLEMENT')} A political region/island/territory; it is not automatically one physical town.</p><p>${badge('NOT_LINKED_TO_HOLDING')} A map X has no matched political holding; it may still be a valid settlement, ruin, road-site or landmark.</p><p><b>LAND_AT_RAW_X</b> is a land mask assessment only. It is not a proof of safe terrain or build approval.</p><p><b>Matching is evidence, not certification.</b> The review dropdown lets you record your own decisions; it doesn't write to runtime JSON.</p></div><div class="panel"><h2>Files that feed the audit</h2>${DB.sources.map(x=>`<div class="source-line">${safe(x)}</div>`).join('')}<p class="small">To rebuild after changing the source data, rerun this Python script. Your browser review notes remain attached to the same holding/marker IDs; export them regularly.</p></div></div>`}
function dataset(){let rows=view==='markers'||view==='unlinked'?M:view==='shared'?H.filter(h=>(h.marker_ids||'').split(';').some(id=>id&&M.filter(m=>m.marker_id===id).length)):H; if(view==='matched')rows=rows.filter(x=>x.status==='CANDIDATE_NOT_APPROVED');if(view==='unmatched')rows=rows.filter(x=>x.status==='NO_MATCHED_MARKER');if(view==='domains')rows=rows.filter(x=>x.status==='DOMAIN_NOT_SETTLEMENT');if(view==='unlinked')rows=rows.filter(x=>x.link_status==='NOT_LINKED_TO_HOLDING');if(view==='shared'){const frequency={};H.forEach(h=>(h.marker_ids||'').split(';').filter(Boolean).forEach(id=>frequency[id]=(frequency[id]||0)+1));rows=H.filter(h=>(h.marker_ids||'').split(';').some(id=>(frequency[id]||0)>1))}return rows}
function renderTable(){let isMarker=view==='markers'||view==='unlinked';let rows=dataset();let statuses=[...new Set(rows.map(x=>isMarker?x.link_status:x.status))].sort();const allZones=[...new Set(M.map(x=>x.marker_id.split('-')[0]))].sort();const control=`<div class="controls"><input id="query" placeholder="Search name, marker, house or location ID…" value="${safe(query)}" oninput="updateSearch(this.value)"><select onchange="filterType=this.value;page=0;renderTable()"><option value="">All statuses</option>${statuses.map(s=>`<option value="${safe(s)}" ${filterType===s?'selected':''}>${safe(label(s))}</option>`).join('')}</select><select onchange="filterZone=this.value;page=0;renderTable()"><option value="">All map regions</option>${allZones.map(z=>`<option value="${z}" ${filterZone===z?'selected':''}>${z}</option>`).join('')}</select></div>`;
if(query){let q=query.toLowerCase();rows=rows.filter(x=>Object.values(x).some(v=>String(v??'').toLowerCase().includes(q)))}if(filterType)rows=rows.filter(x=>(isMarker?x.link_status:x.status)===filterType);if(filterZone)rows=rows.filter(x=>isMarker?x.marker_id.startsWith(filterZone+'-'):(x.marker_ids||'').split(';').some(z=>z.startsWith(filterZone+'-')));if(sortKey)rows.sort((a,b)=>String(a[sortKey]??'').localeCompare(String(b[sortKey]??''),undefined,{numeric:true})*sortDir);const n=rows.length;let pages=Math.max(1,Math.ceil(n/PAGE));page=Math.min(page,pages-1);let shown=rows.slice(page*PAGE,(page+1)*PAGE);
const header=isMarker?[['marker_id','Marker'],['names_in_existing_sources','Observed name(s)'],['link_status','Link status'],['candidate_location_id','Location ID'],['candidate_x','X'],['candidate_z','Z'],['land_mask_status','Land']]:[['holding_name','Holding / place'],['holding_type','Type'],['owner_dynasty_id','House / owner'],['status','Link status'],['marker_ids','Marker'],['world_location_id','Location ID'],['approved_build_coordinates','Build approved?']];
const hrow='<tr>'+header.map(([k,t])=>`<th onclick="sortTable('${k}')">${t} ${sortKey===k?(sortDir>0?'↑':'↓'):'↕'}</th>`).join('')+'</tr>';
const trows=shown.map(x=>`<tr onclick="openDetail('${isMarker?'marker':'holding'}','${isMarker?x.marker_id:x.holding_id}')">`+header.map(([k])=>`<td class="${k.includes('id')||k.includes('candidate_')?'mono':''}">${k==='status'||k==='link_status'?badge(x[k]):safe(x[k]||'—')}</td>`).join('')+'</tr>').join('');const table=`<div class="table-scroll"><table><thead>${hrow}</thead><tbody>${trows}</tbody></table></div>`;const pager=`<div class="pager"><span class="small">${n} records · showing ${n?page*PAGE+1:0}–${Math.min(n,(page+1)*PAGE)}</span><span><button class="outline" onclick="page=Math.max(0,page-1);renderTable()">← Previous</button> <span class="small">${page+1}/${pages}</span> <button class="outline" onclick="page=Math.min(${pages-1},page+1);renderTable()">Next →</button></span></div>`;document.getElementById('content').innerHTML=control+table+pager}
function updateSearch(v){query=v;page=0;renderTable();let el=document.getElementById('query');el.focus();el.setSelectionRange(v.length,v.length)}function sortTable(key){sortDir=sortKey===key?-sortDir:1;sortKey=key;page=0;renderTable()}
function openDetail(kind,id){let h=kind==='holding'?hm[id]:mm[id];if(!h)return;let name=kind==='holding'?h.holding_name:h.marker_id;let details=kind==='holding'?[['Holding ID',h.holding_id],['Type',h.holding_type],['Canonical location',h.world_location_id],['Owning house',h.owner_dynasty_id||'Not authored'],['Holder NPC',h.holder_npc_id||'Not authored'],['Geographic reference exists?',h.location_ref_exists],['B2.2 matching status',label(h.status)],['Approved for construction?',h.approved_build_coordinates]]:[['Marker ID',h.marker_id],['Names in source files',h.names_in_existing_sources],['Linked geographic ID',h.candidate_location_id||'Not linked'],['Matching status',label(h.link_status)],['World X',h.candidate_x],['World Z',h.candidate_z],['Land mask status',h.land_mask_status],['Approved for construction?',h.placement_approved]];
let related=kind==='holding'?(h.candidates||[]).map(m=>`<div class="pill"><strong>${safe(m.markerId)}</strong><div class="mono">X ${safe(m.candidateX)} · Z ${safe(m.candidateZ)}</div><div class="small">${safe(label(m.identityEvidence))} · ${safe(m.landMaskStatus)} · not build-approved</div><button class="outline" onclick="openDetail('marker','${safe(m.markerId)}')">Inspect marker</button></div>`).join(''):(h.linked_holdings||[]).map(i=>`<div class="pill"><strong>${safe(hm[i]?.holding_name||i)}</strong><div class="small">${safe(i)}</div><button class="outline" onclick="openDetail('holding','${safe(i)}')">Inspect holding</button></div>`).join('');let r=getReview(kind,id);document.getElementById('drawer').innerHTML=`<button class="close" onclick="closeDetail()">✕ Close</button><div class="eyebrow">${kind==='holding'?'Political holding':'Map observation'} · Review record</div><h2>${safe(name)}</h2><div class="detailgrid">${details.map(([k,v])=>`<div><b>${safe(k)}</b><span>${safe(v||'—')}</span></div>`).join('')}</div><h3 style="margin-top:24px">${kind==='holding'?'Candidate map observations':'Linked political holdings'}</h3>${related||'<p>No linked records. This is not proof the place lacks coordinates.</p>'}<h3 style="margin-top:24px">Your review</h3><label class="small">My assessment</label><select style="width:100%;margin:5px 0 12px" onchange="setReview('${kind}','${safe(id)}','status',this.value)">${['Not reviewed','Identity looks correct','Wrong or disputed link','Maybe sub-site of another city','Needs map research','Not an active settlement','Approved identity only'].map(z=>`<option ${r.status===z?'selected':''}>${safe(z)}</option>`).join('')}</select><label class="small">Notes or correction</label><textarea oninput="setReview('${kind}','${safe(id)}','note',this.value)" placeholder="Example: Castle Cerwyn is near Winterfell but not marked separately. Do not invent a site.">${safe(r.note||'')}</textarea><div class="small">Automatically saved to this browser. Use “Export my reviews” to keep a portable copy. These choices DO NOT change the mod's canonical records.</div>`;document.getElementById('overlay').classList.add('open')}
function closeDetail(){document.getElementById('overlay').classList.remove('open')}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeDetail()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
function exportReviews(){let rows=[];for(let h of H){let r=getReview('holding',h.holding_id);if((r.status&&r.status!=='Not reviewed')||r.note)rows.push(['holding',h.holding_id,h.holding_name,r.status||'',r.note||''])}for(let m of M){let r=getReview('marker',m.marker_id);if((r.status&&r.status!=='Not reviewed')||r.note)rows.push(['marker',m.marker_id,m.names_in_existing_sources,r.status||'',r.note||''])}let csv=[['record_type','record_id','name','my_assessment','my_notes'],...rows].map(line=>line.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KnownWorld_B2_Manual_Reviews.csv';a.click();URL.revokeObjectURL(url);if(!rows.length)alert('No reviews entered yet; downloaded the empty review template.')}
function mapView(){return `<div class="notice">This is an <b>X/Z observation plot</b>, not a rendered terrain map. Its purpose is spotting geographical outliers and exploring markers, not approving a castle site. Click a point for its details.</div><div class="legend"><span><i class="dot" style="background:#65c9a7"></i>Linked to holding</span><span><i class="dot" style="background:#ecbb6c"></i>Unlinked to holding</span></div><div class="panel"><svg id="plot" class="svg-map" viewBox="0 0 1000 650" role="img" aria-label="Schematic coordinate plot of 253 map markers"></svg><p class="small">Coordinates are plotted in Minecraft X/Z space, scaled to the active observations' bounding rectangle. No land mask or sea boundaries are shown.</p></div>`}
function drawMap(){let svg=document.getElementById('plot');let xs=M.map(m=>+m.candidate_x),zs=M.map(m=>+m.candidate_z);let minx=Math.min(...xs),maxx=Math.max(...xs),minz=Math.min(...zs),maxz=Math.max(...zs),pad=32;let circles=M.map(m=>{let x=pad+(+m.candidate_x-minx)/(maxx-minx||1)*(1000-2*pad),y=pad+(+m.candidate_z-minz)/(maxz-minz||1)*(650-2*pad),color=m.link_status==='NOT_LINKED_TO_HOLDING'?'#ecbb6c':'#65c9a7';return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${color}" onclick="openDetail('marker','${safe(m.marker_id)}')"><title>${safe(m.marker_id)} ${safe(m.names_in_existing_sources)} · X ${safe(m.candidate_x)} Z ${safe(m.candidate_z)}</title></circle>`}).join('');svg.innerHTML=`<rect x="1" y="1" width="998" height="648" rx="8" fill="#10202c"/>${[1,2,3,4].map(i=>`<line x1="${200*i}" y1="0" x2="${200*i}" y2="650" stroke="#2b3e4c"/><line x1="0" y1="${130*i}" x2="1000" y2="${130*i}" stroke="#2b3e4c"/>`).join('')}${circles}`}
render();
</script></body></html>
