<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Known World C1 – Settlement Presets</title>
<style>:root{color-scheme:dark;font:14px system-ui,Segoe UI,Arial}*{box-sizing:border-box}body{background:#0d151c;color:#e7eef4;margin:0}.top{padding:20px 24px;background:#152332;border-bottom:1px solid #374859}.top h1{margin:0 0 8px}.muted{color:#a2b2c1}.grid{display:grid;grid-template-columns:minmax(260px,360px) minmax(400px,1fr);height:calc(100vh - 130px)}aside{overflow-y:auto;border-right:1px solid #304557;padding:15px}main{overflow-y:auto;padding:20px}input,select{background:#233543;color:white;border:1px solid #60768a;border-radius:7px;padding:10px;width:100%;margin:3px 0 8px}.item{display:block;border:1px solid #2c4153;border-radius:9px;padding:12px;margin:8px 0;background:#172735;cursor:pointer;text-align:left;width:100%;color:inherit}.item.sel,.item:hover{background:#2d485c;border-color:#73bbd7}.pill{display:inline-block;padding:3px 8px;border-radius:14px;background:#34536b;font-size:12px;margin:2px 4px 2px 0}.warn{color:#ffcb86}section{background:#162632;border:1px solid #374c5d;border-radius:10px;padding:16px;margin:0 0 15px}table{border-collapse:collapse;width:100%}td,th{padding:7px 9px;border-bottom:1px solid #304557;text-align:left}th{color:#b7ccd9}svg{background:#0c1821;border:1px solid #3b566c;width:100%;height:310px;border-radius:8px}.bars{display:flex;flex-direction:column;gap:4px}.bar{background:#325879;border-radius:6px;padding:4px 8px;white-space:nowrap;min-width:56px}button{cursor:pointer}small{color:#9fb6c5} @media(max-width:750px){.grid{display:block;height:auto}aside{max-height:42vh;border-right:0;border-bottom:1px solid #304557}main{padding:12px}}</style></head><body>
<div class="top"><h1>Known World • C1 Settlement Blueprint Explorer</h1><div id="tot" class="muted"></div><div class="warn">Planning-only — No locations, houses, NPCs or workplaces have been constructed by this C1 dataset.</div></div>
<div class="grid"><aside><input id="search" placeholder="Search marker, place, house or site ID"><select id="tier"><option value="">All tiers</option><option>MAJOR</option><option>MEDIUM</option><option>SMALL</option><option>SPECIAL</option><option>NO_SETTLEMENT</option></select><select id="mode"><option value="">All blueprint modes</option></select><div id="results"></div></aside><main id="detail"><section>Select a place to inspect its planned population, buildings, staffing capacities and compact layout preview.</section></main></div>
<script id="data" type="application/json">__PRESET_JSON__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),S=data.sites;const $=id=>document.getElementById(id);
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('tot').textContent=`${data.summary.markerCount} map observations • ${S.length} unique physical sites • ${data.summary.holdingCount} political holdings • 0 build-approved sites`;
for(const m of [...new Set(S.map(s=>s.blueprintMode))].sort())$('mode').insertAdjacentHTML('beforeend',`<option>${e(m)}</option>`);
let current=null;
function filtered(){const q=$('search').value.toLowerCase(),t=$('tier').value,m=$('mode').value;return S.filter(s=>(!q||[s.name,s.siteId,s.geographicId,...s.markerIds,...s.linkedPoliticalHoldingIds].join(' ').toLowerCase().includes(q))&&(!t||s.tier===t)&&(!m||s.blueprintMode===m));}
function listings(){const a=filtered();$('results').innerHTML=`<small>${a.length} result(s)</small>`+a.map(s=>`<button class="item ${s.siteId===current?'sel':''}" data-id="${e(s.siteId)}"><strong>${e(s.name)}</strong><br><span class="pill">${e(s.tier)}</span><small>${e(s.primaryMarkerId)} • ${e(s.blueprintMode)}</small></button>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>show(b.dataset.id));}
function show(id){current=id;const s=S.find(x=>x.siteId===id);if(!s)return;const d=s.buildingDemand,pre=s.compactLayoutPreview;
let rows=Object.entries(d.workplaceCounts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${e(k)}</td><td>${n.toLocaleString()}</td><td>${d.workplaceMaxStaff[k]??0}</td><td>${e((d.firstPhaseWorkplaceCounts||{})[k]??((d.ruralBeltWorkplaceCounts||{})[k]?'Outer belt':0))}</td></tr>`).join('');
let dots=pre.map((p,i)=>{let cx=220+p.localX*.32,cy=154+p.localZ*.32;let color=p.type==='HOUSE'?'#8bd4e8':'#f6b963';return `<rect x="${cx-2.7}" y="${cy-2.7}" width="5.4" height="5.4" fill="${color}"><title>${e(p.type)} — not terrain-approved</title></rect>`}).join('');
$('detail').innerHTML=`<h2>${e(s.name)} <span class="pill">${e(s.tier)}</span></h2><p class="muted">${e(s.siteId)} • ${e(s.archetype)} • ${e(s.blueprintMode)}</p><section><strong>Geography and politics</strong><p>Marker(s): ${e(s.markerIds.join(', '))} • X=${s.workingAnchor.x} • Z=${s.workingAnchor.z}<br>Palette: ${e(s.paletteId)} • Linked holding(s): ${e(s.linkedPoliticalHoldingIds.join(', ')||'None')}</p><small>All X/Z are accepted atlas anchors, not safe Y/footprints.</small></section><section><strong>Demographic planning — not an instantiated census</strong><table><tr><td>Population target</td><td>${d.peopleTarget.toLocaleString()}</td></tr><tr><td>Worker demand</td><td>${d.workforceTarget.toLocaleString()}</td></tr><tr><td>Estimated households</td><td>${d.householdsEstimated.toLocaleString()}</td></tr><tr><td>Housing buildings needed</td><td>${d.housingBuildingsDemand.toLocaleString()}</td></tr><tr><td>Initial-phase housing plots</td><td>${d.firstPhaseHousingPlots.toLocaleString()}</td></tr><tr><td class="warn">Housing backlog</td><td>${d.housingBuildingBacklog.toLocaleString()}</td></tr></table></section><section><strong>Provisional buildings and staffing</strong><small>Several workers per farm/bakery/smithy; each building has a maximum staffing capacity. Rural fields form a separate belt.</small><table><thead><tr><th>Building</th><th>Demand</th><th>Staff per building</th><th>Phase 1</th></tr></thead><tbody>${rows}</tbody></table></section><section><strong>Compact layout schematic</strong><p class="muted">Maximum residential-core radius ${s.cityCore.radiusMaximumMeters}m; connected ${s.cityCore.districtCountTarget} districts. Not a physical map and not approved for block placement.</p><svg viewBox="0 0 440 308"><g stroke="#294050" stroke-width="1">${Array.from({length:18},(_,i)=>`<path d="M ${i*25} 0 V 308 M 0 ${i*25} H 440"/>`).join('')}</g><circle cx="220" cy="154" r="14" fill="#77d2a4"><title>Planned civic center</title></circle>${dots}</svg><p><span class="pill">Green: civic core</span><span class="pill">Blue: homes</span><span class="pill">Amber: workplaces</span></p></section><section><strong>Constraints</strong><p class="warn">No trees or lava in future build footprints • skip unsafe water • survey mountains for terracing • preserve existing chunks • never invent NPC families for house signs.</p><p>Expansion: append-only growth phases, extra farms only when actual staffing and food needs require them; temporary military camps will have faction ownership and lifetime.</p></section>`;listings();}
['search','tier','mode'].forEach(k=>$(k).addEventListener(k==='search'?'input':'change',listings));listings();if(S.length)show(S.find(s=>s.primaryMarkerId==='NEE-005')?.siteId||S[0].siteId);
</script></body></html>
