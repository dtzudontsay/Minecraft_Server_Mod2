<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Known World · B2.3 research atlas</title>
<style>
:root{--bg:#0c131b;--pane:#17222e;--edge:#324457;--txt:#e9f0f4;--mute:#a9bac6;--hi:#dfae57;--good:#64c99c;--blue:#8ebce7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,'Segoe UI',sans-serif}header{padding:22px 26px;background:#132332;border-bottom:1px solid var(--edge)}h1{font-size:27px;margin:0;font-weight:650}header p{margin:4px 0;color:var(--mute)}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.chip{border:1px solid var(--edge);border-radius:8px;padding:10px 15px;background:#1c2e3b}.chip strong{font-size:21px;display:block}.toolbar{display:flex;gap:10px;flex-wrap:wrap;padding:16px 25px;background:#111c26;border-bottom:1px solid var(--edge)}input,select,textarea,button{font:inherit;background:#203141;color:var(--txt);border:1px solid #526475;border-radius:7px;padding:9px}input{width:295px}button{cursor:pointer;background:#364b5d}button:hover{background:#4d6477}.work{display:grid;grid-template-columns:minmax(440px,1fr) minmax(390px,1.2fr);gap:0;min-height:calc(100vh - 220px)}.results{overflow:auto;border-right:1px solid var(--edge);height:calc(100vh - 220px)}.details{overflow:auto;height:calc(100vh - 220px);padding:25px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #263848}th{position:sticky;top:0;background:#233341;z-index:1;color:var(--mute);font-weight:550}tbody tr{cursor:pointer}tbody tr:hover{background:#273948}tbody tr.selected{background:#314457}small,.muted{color:var(--mute)}.mono{font:12px ui-monospace,monospace;color:#bbced8}.tag{display:inline-block;border-radius:999px;border:1px solid #506178;padding:2px 7px;font-size:11px}.tag.CONFIRMED{border-color:#308a65;color:#87e9b2}.tag.CONTEXT{border-color:#ac834b;color:#f7cd83}.tag.INVENTED{border-color:#ba6b6b;color:#ffbdb7}h2{font-size:23px;margin:0 0 7px}h3{font-size:16px;border-top:1px solid var(--edge);padding-top:15px;margin-top:23px}dl{display:grid;grid-template-columns:140px 1fr;gap:8px;margin:12px 0}dt{color:var(--mute)}dd{margin:0}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{background:var(--pane);padding:10px;border:1px solid var(--edge);border-radius:8px}.fact span{display:block;color:var(--mute);font-size:11px}.fact strong{font-size:18px}.job{display:flex;align-items:center;gap:10px;margin:5px 0}.joblabel{width:180px;font-size:12px}.bar{flex:1;height:10px;border-radius:4px;background:#2d3948;overflow:hidden}.bar i{display:block;background:#789fb6;height:100%}.section{background:var(--pane);padding:14px;border-radius:8px;margin-top:12px;border:1px solid var(--edge)}.source{display:block;overflow-wrap:anywhere;color:var(--blue);margin:4px 0}textarea{min-height:78px;width:100%;resize:vertical}.alert{background:#352f22;border-left:3px solid var(--hi);padding:9px 14px;margin:14px 0;color:#f8daaa}.empty{padding:35px;text-align:center;color:var(--mute)}@media(max-width:940px){.work{display:block}.results,.details{height:auto;max-height:75vh;border-right:0}.details{max-height:none}dl{grid-template-columns:120px 1fr}}
</style></head><body>
<header><h1>KNOWN WORLD <span style="color:var(--hi)">/</span> WORLD SITE RESEARCH</h1><p>298 AC · B2.3 · 253 map observations · independent source claims vs contextual vs invented scenario values</p><div class="chips" id="summary"></div></header>
<div class="toolbar"><input id="search" placeholder="Find site, ID, house, culture, notes…"><select id="zone"><option value="">All zones</option></select><select id="hab"><option value="">All habitation statuses</option><option value="INHABITED">Inhabited</option><option value="RUIN_NO_ESTABLISHED_PERMANENT_POPULATION">Ruins / no confirmed permanent people</option><option value="UNVERIFIED_EXISTENCE">Legendary / uncertain existence</option></select><select id="kind"><option value="">All site kinds</option></select><button id="export">Export my review notes (; CSV)</button></div>
<div class="work"><div class="results"><table><thead><tr><th>Marker</th><th>Place</th><th>Context</th><th>Residents*</th></tr></thead><tbody id="list"></tbody></table></div><div id="detail" class="details"><div class="empty">Select a marker to inspect the full profile.</div></div></div>
<script>
const DB=__PROFILE_DATA__;
const sites=DB.sites;
let current=sites[0]?.id;
const grades=['CONFIRMED','CONTEXT','INVENTED'];
const esc=v=>String(v??'—').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const fmt=n=>typeof n==='number'?n.toLocaleString('en-US'):esc(n);
const badge=s=>`<span class="tag ${esc(s)}">${esc(s)}</span>`;
const fact=(a)=>`<div class="section">${esc(typeof a.value==='object'?JSON.stringify(a.value):a.value)} &nbsp; ${badge(a.evidence)} <div class="muted">${esc(a.note||'')}</div></div>`;
const source=(id)=>{const u=DB.summary.sources[id]||id;return /^https?:/.test(u)?`<a class="source" href="${esc(u)}" target="_blank" rel="noreferrer">${esc(id)} ↗</a>`:`<div class="source">${esc(id)} — ${esc(u)}</div>`};
const reviews=(()=>{try{return JSON.parse(localStorage.getItem('kw_b23_research_notes')||'{}')}catch{return {}}})();
function save(){try{localStorage.setItem('kw_b23_research_notes',JSON.stringify(reviews))}catch(e){}}
function selected(){return sites.find(s=>s.id===current)||sites[0]}
function selectSite(id){current=id;renderList();renderDetail()}
function renderList(){const q=document.querySelector('#search').value.toLowerCase(),zone=document.querySelector('#zone').value,hab=document.querySelector('#hab').value,kind=document.querySelector('#kind').value;
const items=sites.filter(s=>(!zone||s.map.zone===zone)&&(!hab||s.site.habitationAt298AC.value===hab)&&(!kind||s.site.kind.value===kind)&&(!q||[s.id,s.displayName,JSON.stringify(s.politics.holdingAuthorities.value),s.site.historicalOrPhysicalNotes.value,s.society.culture.value].join(' ').toLowerCase().includes(q)));
document.querySelector('#list').innerHTML=items.map(s=>`<tr class="${current===s.id?'selected':''}" data-mid="${esc(s.id)}"><td class="mono">${esc(s.id)}</td><td><strong>${esc(s.displayName)}</strong><br><small>${esc(s.map.zone)}</small></td><td><small>${esc(s.site.kind.value)}</small></td><td>${fmt(s.society.population.value.baseline)}</td></tr>`).join('')||'<tr><td colspan="4">No matching sites</td></tr>';
document.querySelectorAll('[data-mid]').forEach(el=>el.onclick=()=>selectSite(el.dataset.mid));}
function renderDetail(){const s=selected();if(!s)return;const p=s.society.population.value,r=reviews[s.id]||{},h=s.politics.holdingAuthorities.value;
const val = a=>`${esc(typeof a.value==='object'?JSON.stringify(a.value):a.value)} ${badge(a.evidence)}`;
document.querySelector('#detail').innerHTML=`<div><small>${esc(s.id)} · ${esc(s.map.zone)}</small><h2>${esc(s.displayName)}</h2><div class="alert">* Population and occupation numbers are planning estimates unless specifically sourced. No locations are build-approved. Records do not create NPCs or political holdings.</div>
<div class="facts"><div class="fact"><span>Residents baseline</span><strong>${fmt(p.baseline)}</strong><small>${badge(p.baselineEvidence)}</small></div><div class="fact"><span>Low / high scenario range</span><strong>${fmt(p.min)} – ${fmt(p.max)}</strong><small>${badge(p.planningRangeEvidence)}</small></div><div class="fact"><span>Marker coordinates X / Z</span><strong style="font-size:12px">${fmt(s.map.candidateX)} / ${fmt(s.map.candidateZ)}</strong><small>NOT BUILD APPROVED</small></div></div>
<h3>Identity and habitation</h3><dl><dt>Type</dt><dd>${val(s.site.kind)}</dd><dt>At 298 AC</dt><dd>${val(s.site.habitationAt298AC)}</dd><dt>Geographic ID</dt><dd>${val(s.geography.geographicId)}</dd><dt>Map holding status</dt><dd>${esc(s.geography.externalMarkerHoldingLinkStatus)}</dd><dt>Primary resident marker</dt><dd>${esc(s.map.primaryPopulationMarkerId)}</dd></dl>
<h3>Political and cultural setting</h3><dl><dt>Holdings (if any)</dt><dd>${esc(s.politics.scenarioHoldingIds.value.join(', ')||'None authored')}</dd><dt>Leading houses</dt><dd>${esc(h.map(x=>x.ownerDynastyId).filter(Boolean).join(', ')||'No authored dynasty')}</dd><dt>Named holders</dt><dd>${esc(h.map(x=>x.holderNpcId).filter(Boolean).join(', ')||'Not authored')}</dd><dt>Government</dt><dd>${val(s.politics.leadingStructure)}</dd><dt>Culture</dt><dd>${val(s.society.culture)}</dd><dt>Religion</dt><dd>${val(s.society.religion)}</dd><dt>Regional influences</dt><dd>${val(s.politics.regionalInfluences)}</dd></dl>
<h3>Occupations of working individuals · ${badge('INVENTED')}</h3><p class="muted">These are shares of workers, not shares of the overall population. They are future planning targets, not instantiated employees.</p>
${Object.entries(s.society.occupationRolesOfWorkers.value).filter(([k,v])=>v>0).map(([k,v])=>`<div class="job"><span class="joblabel">${esc(k.replaceAll('_',' '))}</span><div class="bar"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')||'<p>No permanent workforce modeled.</p>'}
<h3>Research notes</h3>${fact(s.site.historicalOrPhysicalNotes)}
<h3>Source register</h3>${s.sourceIds.map(source).join('')}
<h3>Personal review</h3><div class="section"><label>Review decision</label> <select id="reviewChoice"><option value="NOT_REVIEWED">Not reviewed</option><option value="ACCEPT_CONTEXT">Plausible context</option><option value="CHECK_SOURCES">Needs historical/source check</option><option value="WRONG_IDENTITY">Wrong identity / marker</option><option value="WRONG_POPULATION">Population should change</option><option value="WRONG_OCCUPATION">Jobs should change</option><option value="WRONG_GOVERNANCE">Leadership should change</option><option value="REJECT_SITE">Historic ruin / do not populate</option></select><p><label>Notes</label></p><textarea id="reviewNote" placeholder="Add details and sources. Save via Export."></textarea></div></div>`;
const choice=document.querySelector('#reviewChoice'),note=document.querySelector('#reviewNote');choice.value=r.choice||'NOT_REVIEWED';note.value=r.note||'';choice.onchange=()=>{reviews[s.id]={...(reviews[s.id]||{}),choice:choice.value,note:note.value};save()};note.oninput=()=>{reviews[s.id]={...(reviews[s.id]||{}),choice:choice.value,note:note.value};save()};}
for(const zone of [...new Set(sites.map(s=>s.map.zone))].sort())document.querySelector('#zone').insertAdjacentHTML('beforeend',`<option value="${zone}">${zone}</option>`);
for(const kind of [...new Set(sites.map(s=>s.site.kind.value))].sort())document.querySelector('#kind').insertAdjacentHTML('beforeend',`<option value="${kind}">${kind.replaceAll('_',' ')}</option>`);
for(const id of ['search','zone','hab','kind'])document.getElementById(id).addEventListener(id==='search'?'input':'change',renderList);
document.querySelector('#summary').innerHTML=[['Active markers',sites.length],['Sites with authored detail',__OVERRIDE_COUNT__],['Build-approved sites',0],['Historical starting year','298 AC']].map(([a,b])=>`<div class="chip"><small>${a}</small><strong>${b}</strong></div>`).join('');
document.getElementById('export').onclick=()=>{const rows=[['marker_id','review_decision','notes']];sites.forEach(s=>{const r=reviews[s.id]||{};rows.push([s.id,r.choice||'NOT_REVIEWED',r.note||''])});let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='B2_3_WORLD_SITE_RESEARCH_REVIEW.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
renderList();renderDetail();
</script></body></html>
